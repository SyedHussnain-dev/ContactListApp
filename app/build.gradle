plugins { id 'com.android.application' }

android { namespace 'com.example.pulsedialer'; compileSdk 37
    defaultConfig { applicationId 'com.example.pulsedialer'; minSdk 26; targetSdk 37; versionCode 1; versionName '1.0' }
    buildFeatures { viewBinding true }
    buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.fragment:fragment:1.8.4'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    testImplementation 'junit:junit:4.13.2'
}
